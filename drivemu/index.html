<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drivemu</title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#111115">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/theme.js"></script>
</head>
<body>

<!-- Sign-in -->
<section id="login" class="login hidden">
  <aside class="brand">
    <div class="logo light"><div class="logo-mark"></div><span class="wordmark">Drive<span class="highlight">mu</span></span></div>
    <div class="brand-copy">
      <h1 data-i18n="brand.title"></h1>
      <p data-i18n="brand.text"></p>
      <ul class="feats">
        <li><span class="feat-ico"><span class="icon i-lock"></span></span><div><b data-i18n="brand.private.title"></b><span data-i18n="brand.private.text"></span></div></li>
        <li><span class="feat-ico"><span class="icon i-zap"></span></span><div><b data-i18n="brand.backend.title"></b><span data-i18n="brand.backend.text"></span></div></li>
        <li><span class="feat-ico"><span class="icon i-git-branch"></span></span><div><b data-i18n="brand.history.title"></b><span data-i18n="brand.history.text"></span></div></li>
      </ul>
    </div>
  </aside>

  <div class="login-pane">
    <select class="language" data-i18n-label="language"></select>
    <div class="login-card">
      <div class="logo mobile-only"><div class="logo-mark"></div><span class="wordmark">Drive<span class="highlight">mu</span></span></div>
      <div class="login-head">
        <h2 id="loginTitle"></h2>
        <p class="muted" id="loginSub"></p>
      </div>
      <button class="btn primary cta" id="loginBtn" type="button" data-i18n="login.signIn"></button>
      <p id="loginError" class="error" role="alert"></p>
    </div>
  </div>
</section>

<!-- App -->
<div id="app" class="app hidden">
  <div class="content">
    <header class="topbar">
      <div class="logo"><div class="logo-mark"></div><span class="wordmark">Drive<span class="highlight">mu</span></span></div>
      <button class="btn primary" id="newBtn"><span class="icon i-plus"></span><span data-i18n="new"></span></button>
      <label class="searchbox">
        <span class="icon i-search"></span>
        <input id="search" type="search" data-i18n-placeholder="search" data-i18n-label="search">
      </label>
    <select id="sort" data-i18n-label="sort.label">
      <option value="name:1" data-i18n="sort.nameAsc"></option>
      <option value="name:-1" data-i18n="sort.nameDesc"></option>
      <option value="type:1" data-i18n="sort.typeAsc"></option>
      <option value="size:1" data-i18n="sort.sizeAsc"></option>
      <option value="size:-1" data-i18n="sort.sizeDesc"></option>
    </select>
      <div class="spacer"></div>
      <div class="tools">
        <button class="btn ghost square" id="refreshBtn" data-i18n-title="refresh"><span class="icon i-refresh"></span></button>
        <div class="seg" role="group" data-i18n-label="view">
          <button id="viewList" data-i18n-title="view.list"><span class="icon i-list"></span></button>
          <button id="viewGrid" data-i18n-title="view.grid"><span class="icon i-grid"></span></button>
        </div>
        <button class="btn ghost square" data-act="settings" data-i18n-title="settings" data-i18n-label="settings"><span class="icon i-sliders"></span></button>
        <button class="btn ghost square account" data-act="account" data-i18n-title="account" data-i18n-label="account"><span class="icon i-user"></span></button>
      </div>
    </header>

    <main class="main" id="dropzone">
      <div class="titlebar">
        <nav id="crumbs" class="crumbs"></nav>
        <div id="selbar" class="selbar hidden">
          <button class="btn ghost square" id="selClear" data-i18n-title="sel.clear"><span class="icon i-close"></span></button>
          <b id="selCount"></b>
          <div class="spacer"></div>
          <button class="btn danger" id="bulkDelete"><span class="icon i-trash"></span><span data-i18n="delete"></span></button>
        </div>
      </div>

      <div id="list" class="list"></div>

      <div id="empty" class="empty hidden">
        <div class="empty-art"><span class="icon i-folder-open"></span></div>
        <h3 id="emptyTitle"></h3>
        <p id="emptyText" class="muted"></p>
        <button class="btn primary" id="emptyCta"><span class="icon i-upload"></span><span data-i18n="menu.uploadFiles"></span></button>
      </div>
      <div id="loading" class="loading hidden"></div>
      <div id="dropOverlay" class="drop-overlay hidden"><span class="icon i-upload"></span><span data-i18n="drop"></span></div>
    </main>

    <footer class="statusbar" id="status"></footer>
  </div>
</div>

<!-- "New" menu -->
<div id="newMenu" class="menu hidden" role="menu">
  <button role="menuitem" data-act="files"><span class="icon i-upload"></span><span data-i18n="menu.uploadFiles"></span></button>
  <button role="menuitem" data-act="folder-upload"><span class="icon i-folder-up"></span><span data-i18n="menu.uploadFolder"></span></button>
  <hr>
  <button role="menuitem" data-act="folder"><span class="icon i-folder-plus"></span><span data-i18n="menu.newFolder"></span></button>
</div>
<input type="file" id="fileInput" multiple hidden>
<input type="file" id="folderInput" webkitdirectory hidden>

<!-- Generic dialog -->
<dialog id="dlg" class="dlg">
  <form method="dialog" id="dlgForm">
    <h3 id="dlgTitle"></h3>
    <p id="dlgText" class="muted"></p>
    <input id="dlgInput" type="text" class="hidden">
    <div class="dlg-actions">
      <button class="btn" value="cancel" type="button" id="dlgCancel" data-i18n="cancel"></button>
      <button class="btn primary" value="ok" id="dlgOk" data-i18n="ok"></button>
    </div>
  </form>
</dialog>

<!-- Settings -->
<dialog id="settings" class="dlg settings">
  <div class="preview-head">
    <b data-i18n="settings"></b>
    <div class="spacer"></div>
    <button class="btn ghost square" id="settingsClose" data-i18n-title="close"><span class="icon i-close"></span></button>
  </div>
  <div id="settingsBody" class="settings-body"></div>
</dialog>

<!-- Preview -->
<dialog id="preview" class="dlg preview">
  <div class="preview-head">
    <b id="pvName"></b>
    <div class="spacer"></div>
    <button class="btn" id="pvDownload"><span class="icon i-download"></span><span data-i18n="download"></span></button>
    <button class="btn ghost square" id="pvClose" data-i18n-title="close"><span class="icon i-close"></span></button>
  </div>
  <div id="pvBody" class="preview-body"></div>
</dialog>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="../assets/i18n.js"></script>
<script src="../assets/account.js"></script>
<script src="script.js"></script>
</body>
</html>
