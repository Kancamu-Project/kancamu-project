<body>
<!-- seo-body -->
<noscript>
  <h1>Drivemu</h1>
  <p>Simple file storage for everyone.</p>
  <p><a href="../">Kancamu</a></p>
  <p>This page needs JavaScript.</p>

<!-- App -->
  <kit-header id="header" menu data-i18n-menu-label="list.folders"></kit-header>
  <kit-sidebar id="sidebar" data-i18n-label="list.folders">
      <div id="usage" class="usage" slot="after"></div>
  </kit-sidebar>

  <div id="main" class="main">
  <div class="topbar">
    <button class="primary" id="new-button"><span class="icon icon-plus"></span><span data-i18n="new"></span></button>
    <kit-search input-id="file-search" data-i18n-placeholder="search" data-i18n-label="search"></kit-search>
    <select id="sort-order" data-i18n-label="sort.label">
      <option value="name:1" data-i18n="sort.nameAsc"></option>
      <option value="name:-1" data-i18n="sort.nameDesc"></option>
      <option value="type:1" data-i18n="sort.typeAsc"></option>
      <option value="size:1" data-i18n="sort.sizeAsc"></option>
      <option value="size:-1" data-i18n="sort.sizeDesc"></option>
    </select>
    <div class="spacer"></div>
    <button class="ghost square" id="refresh-button" data-i18n-title="refresh" data-i18n-label="refresh"><span class="icon icon-refresh"></span></button>
    <div class="segmented-control" role="group" data-i18n-label="view">
      <button id="view-list-button" class="square" data-i18n-title="view.list"><span class="icon icon-list"></span></button>
      <button id="view-grid-button" class="square" data-i18n-title="view.grid"><span class="icon icon-grid"></span></button>
    </div>
  </div>

  <div class="files-area" id="drop-zone">
    <div class="titlebar">
      <kit-breadcrumbs id="breadcrumbs"></kit-breadcrumbs>
      <div id="selection-bar" class="selection-bar hidden">
        <button class="ghost square" id="selection-clear-button" data-i18n-title="sel.clear"><span class="icon icon-close"></span></button>
        <b id="selection-count"></b>
        <div class="spacer"></div>
        <button class="danger" id="delete-selected-button"><span class="icon icon-trash"></span><span data-i18n="delete"></span></button>
      </div>
    </div>

    <div id="file-list" class="list"></div>

    <kit-empty id="empty" class="hidden" icon="folder-open">
      <button slot="action" class="primary" id="empty-action-button"></button>
    </kit-empty>
    <div id="loading" class="loading hidden"></div>
    <div id="drop-overlay" class="drop-overlay hidden"><span class="icon icon-upload"></span><span data-i18n="drop"></span></div>
  </div>

  </div>
  <kit-footer id="footer" status></kit-footer>

<input type="file" id="file-input" multiple hidden>
<input type="file" id="folder-input" webkitdirectory hidden>

<!-- Generic dialog -->

<!-- Preview -->
<dialog id="preview" class="message-dialog preview">
  <div class="preview-header">
    <b id="preview-name"></b>
    <div class="spacer"></div>
    <button id="preview-download-button"><span class="icon icon-download"></span><span data-i18n="download"></span></button>
    <button class="ghost square" id="preview-close-button" data-i18n-title="close"><span class="icon icon-close"></span></button>
  </div>
  <div id="preview-content" class="preview-body"></div>
</dialog>


<div id="popups" class="popups"></div>
</body>
</html>
