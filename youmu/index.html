<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<meta name="description" content="Your sign-in, your profile, and the settings of every app.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Kancamu">
<meta property="og:title" content="Youmu">
<meta property="og:description" content="Your sign-in, your profile, and the settings of every app.">
<meta property="og:url" content="https://kancamu.site/youmu/">
<meta property="og:image" content="https://kancamu.site/youmu/preview.png?v=2">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Youmu: Your sign-in, your profile, and the settings of every app.">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#1a1a1b">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/page.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/js/theme.js"></script>
<script defer src="../assets/js/cleanup.js"></script>
<script defer src="../assets/js/url.js"></script>
<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/popup.js"></script>
<script defer src="../assets/js/components.js"></script>
<script defer src="../assets/js/account.js"></script>
<script defer src="../assets/js/storage.js"></script>
<script defer src="../assets/js/settings.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
  <kit-header id="header" menu no-account></kit-header>
  <kit-sidebar id="sidebar" tablist>
        <button id="account-tab" class="sidebar-item" type="button" role="tab"><span class="icon icon-user"></span><span data-i18n="account"></span></button>
        <span class="sidebar-title" data-i18n="settings"></span>
        <div id="sidebar-apps" class="sidebar-apps"></div>
      </kit-sidebar>

  <div id="main" class="main">
    <div class="topbar">
      <select class="language" data-i18n-label="language"></select>
      <button id="theme-button" class="square" type="button" data-i18n-title="theme" data-i18n-label="theme"><span class="icon icon-sun"></span></button>
      <button id="close-button" class="square" type="button" hidden data-i18n-title="close" data-i18n-label="close"><span class="icon icon-close"></span></button>
    </div>

    <div class="content" tabindex="-1">
      <div id="login-page">
        <span class="hint" data-i18n="hint"></span>
        <div class="form-actions">
          <button id="github-button" class="primary" type="button"><span class="icon icon-github"></span><span data-i18n="signInGitHub"></span></button>
        </div>
      </div>

      <div id="account-profile">
        <div class="profile-card">
          <div class="avatar"></div>
          <div class="account-names selectable">
            <span class="account-name"></span>
            <span class="account-login"></span>
            <span class="account-bio"></span>
          </div>
          <button id="sign-out-button" class="danger" type="button"><span class="icon icon-logout"></span><span data-i18n="signOut"></span></button>
        </div>
        <div id="profile-stats" class="profile-stats"></div>
        <div id="account-details" class="selectable"></div>
        <span class="hint" data-i18n="signedIn"></span>
      </div>

      <div id="settings-page"></div>
    </div>

  </div>
  <kit-footer id="footer"></kit-footer>
<div id="popups" class="popups"></div>
</body>
</html>
