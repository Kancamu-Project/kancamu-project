<body class="page">
<!-- seo-body -->
<noscript>
  <h1>Transmu</h1>
  <p>Translate text with AI, right in your browser.</p>
  <p><a href="../">Kancamu</a></p>
  <p>This page needs JavaScript.</p>
</noscript>
<!-- /seo-body -->

<kit-header id="header"></kit-header>
<div id="main" class="main">

  <label class="model-bar">
    <span class="model-label" data-i18n="model.label"></span>
    <select id="model-select" data-i18n-label="model.label"></select>
  </label>

  <div class="language-bar">
    <select id="source-language" data-i18n-label="from.label"></select>
    <button id="swap-button" class="square" type="button" data-i18n-title="swap" data-i18n-label="swap"><span class="icon icon-swap"></span></button>
    <select id="target-language" data-i18n-label="to.label"></select>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="pane-bar">
        <span class="pane-title" data-i18n="source.title"></span>
        <span id="source-count" class="pane-count"></span>
        <button id="clear-button" class="ghost square" type="button" data-i18n-title="clear" data-i18n-label="clear"><span class="icon icon-close"></span></button>
      </div>
      <textarea id="source-text" class="pane-text" dir="auto" data-i18n-placeholder="source.placeholder" data-i18n-label="source.title"></textarea>
    </div>
    <div class="pane">
      <div class="pane-bar">
        <span class="pane-title" data-i18n="target.title"></span>
        <button id="copy-button" class="ghost square" type="button" disabled data-i18n-title="copy" data-i18n-label="copy"><span class="icon icon-copy"></span></button>
      </div>
      <div id="target-text" class="pane-text selectable" role="textbox" aria-readonly="true" tabindex="0" data-i18n-label="target.title"></div>
    </div>
  </div>

  <div class="actions">
    <button id="translate-button" class="primary" type="button"><span class="icon icon-send"></span><span data-i18n="translate"></span></button>
    <button id="stop-button" class="hidden" type="button"><span class="icon icon-stop"></span><span data-i18n="stop"></span></button>
  </div>

</div>
<kit-footer id="footer" status></kit-footer>

<div id="popups" class="popups"></div>
</body>
</html>
