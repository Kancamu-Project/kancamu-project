<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#111115">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/theme.js"></script>
</head>
<body>

<div id="music-app" class="music-app">
  <div class="header">
    <div class="logo"><div class="logo-mark"></div><span class="logo-name" data-i18n-html="logo"></span></div>
    <div class="header-tools">
      <button id="account-button" class="ghost square account" type="button" data-i18n-title="account" data-i18n-label="account"><span class="icon icon-user"></span></button>
    </div>
  </div>

  <div class="toolbar">
    <label class="searchbox">
      <span class="icon icon-search"></span>
      <input id="music-search" type="search" data-i18n-placeholder="search" data-i18n-label="search.label">
    </label>
    <select id="album-select" data-i18n-label="album.label"></select>
    <select id="sort-order" data-i18n-label="sort.label">
      <option value="album-asc" data-i18n="sort.albumAsc"></option>
      <option value="name-asc" data-i18n="sort.nameAsc"></option>
      <option value="name-desc" data-i18n="sort.nameDesc"></option>
      <option value="size-asc" data-i18n="sort.sizeAsc"></option>
      <option value="size-desc" data-i18n="sort.sizeDesc"></option>
    </select>
    <button id="refresh-button" class="square" type="button" data-i18n-title="refresh" data-i18n-label="refresh"><span class="icon icon-refresh"></span></button>
  </div>

  <div id="music" class="music">
    <div id="track-list" class="track-list hidden"></div>
    <div id="empty-state" class="empty-state hidden">
      <div class="empty-illustration"><span class="icon icon-audio"></span></div>
      <span id="empty-title" class="empty-title"></span>
      <span id="empty-text" class="empty-text"></span>
      <button id="empty-action-button" class="primary hidden" type="button"><span class="icon icon-user"></span><span data-i18n="login.signIn"></span></button>
    </div>
  </div>

  <div class="player">
    <div class="player-line">
      <span id="player-name" class="player-name"></span>
      <span id="player-time" class="player-time"></span>
    </div>
    <input id="seek-slider" class="seek-slider" type="range" min="0" max="0" step="0.1" value="0" disabled data-i18n-label="player.seek">
    <div class="player-controls">
      <button id="shuffle-button" class="square" type="button" aria-pressed="false" data-i18n-title="player.shuffle" data-i18n-label="player.shuffle"><span class="icon icon-shuffle"></span></button>
      <button id="previous-button" class="square" type="button" data-i18n-title="player.previous" data-i18n-label="player.previous"><span class="icon icon-skip-back"></span></button>
      <button id="play-button" class="primary square" type="button" data-i18n-title="player.play" data-i18n-label="player.play"><span id="play-icon" class="icon icon-play"></span></button>
      <button id="next-button" class="square" type="button" data-i18n-title="player.next" data-i18n-label="player.next"><span class="icon icon-skip-forward"></span></button>
      <button id="repeat-button" class="square repeat-button" type="button"><span class="icon icon-repeat"></span><span id="repeat-mark" class="repeat-mark"></span></button>
      <div class="volume">
        <span class="icon icon-volume"></span>
        <input id="volume-slider" class="volume-slider" type="range" min="0" max="1" step="0.01" data-i18n-label="player.volume">
      </div>
    </div>
  </div>

  <div class="statusbar">
    <span id="status"></span>
    <a href="/" target="_top" data-i18n="copyright"></a>
  </div>
</div>

<audio id="audio-element" preload="auto"></audio>

<script src="../assets/i18n.js"></script>
<script src="../assets/dialog.js"></script>
<script src="../assets/autocomplete.js"></script>
<script src="../assets/account.js"></script>
<script src="../assets/settings.js"></script>
<script src="../assets/storage.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
