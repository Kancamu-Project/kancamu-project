<body class="page">
<!-- seo-body -->
<noscript>
  <h1>Guyonmu</h1>
  <p>Short posts, replies, and friends, in one place.</p>
  <p><a href="../">Kancamu</a></p>
  <p>This page needs JavaScript.</p>
</noscript>
<!-- /seo-body -->

<kit-header id="header" menu data-i18n-menu-label="nav.label"></kit-header>
<kit-sidebar id="sidebar">
  <button id="new-post-button" slot="after" class="primary new-post" type="button"><span class="icon icon-plus"></span><span data-i18n="compose.new"></span></button>
</kit-sidebar>
<div id="main" class="main">

  <div class="topbar">
    <button id="back-button" class="square hidden" type="button" data-i18n-title="back" data-i18n-label="back"><span class="icon icon-chevron-left"></span></button>
    <span id="view-title" class="view-title"></span>
    <kit-search input-id="post-search" data-i18n-placeholder="search" data-i18n-label="search.label"></kit-search>
    <button id="refresh-button" class="square" type="button" data-i18n-title="refresh" data-i18n-label="refresh"><span class="icon icon-refresh"></span></button>
  </div>

  <div id="timeline" class="timeline">
    <kit-tabs id="feed-tabs" class="hidden" value="home">
      <button type="button" value="home"><span data-i18n="tabs.home"></span></button>
      <button type="button" value="following"><span data-i18n="tabs.following"></span></button>
    </kit-tabs>
    <button id="new-posts-button" class="primary new-posts hidden" type="button"><span id="new-posts-text"></span></button>
    <kit-tabs id="profile-tabs" class="hidden" value="posts">
      <button type="button" value="posts"><span data-i18n="tabs.posts"></span></button>
      <button type="button" value="replies"><span data-i18n="tabs.replies"></span></button>
      <button type="button" value="likes" data-own><span data-i18n="tabs.likes"></span></button>
    </kit-tabs>
    <div id="profile-card" class="profile-card hidden"></div>
    <div id="feed" class="feed">
    <div id="root-post" class="root-post"></div>
    <div id="composer" class="composer hidden">
      <div id="composer-avatar" class="avatar"></div>
      <div class="composer-fields">
        <textarea id="composer-text" rows="2" data-i18n-label="compose.label"></textarea>
        <div id="composer-images" class="composer-images"></div>
        <div class="composer-actions">
          <button id="composer-image-button" class="square" type="button" data-i18n-title="compose.addImage" data-i18n-label="compose.addImage"><span class="icon icon-image"></span></button>
          <input id="composer-image-input" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
          <span id="composer-counter" class="composer-counter"></span>
          <button id="composer-button" class="primary" type="button"><span id="composer-button-text"></span></button>
        </div>
      </div>
    </div>
    <div id="signin-row" class="signin-row hidden">
      <span data-i18n="compose.signIn"></span>
      <button id="signin-button" type="button"><span class="icon icon-user"></span><span data-i18n="login.signIn"></span></button>
    </div>
    <div id="people" class="people hidden"></div>
    <div id="post-list" class="post-list"></div>
    </div>
    <kit-empty id="empty-state" class="hidden" icon="message"></kit-empty>
    <button id="more-button" class="load-more hidden" type="button"><span data-i18n="load.more"></span></button>
  </div>

</div>
<kit-footer id="footer" status></kit-footer>

<dialog id="compose-dialog" class="compose-dialog">
  <div class="compose-bar">
    <span id="compose-title" class="compose-title" data-i18n="compose.new"></span>
    <button id="compose-close-button" class="square" type="button" data-i18n-title="close" data-i18n-label="close"><span class="icon icon-close"></span></button>
  </div>
  <div class="composer">
    <div id="dialog-avatar" class="avatar"></div>
    <div class="composer-fields">
      <textarea id="dialog-text" rows="3" data-i18n-label="compose.label"></textarea>
      <div id="dialog-images" class="composer-images"></div>
      <div id="dialog-quote" class="dialog-quote hidden"></div>
      <div class="composer-actions">
        <button id="dialog-image-button" class="square" type="button" data-i18n-title="compose.addImage" data-i18n-label="compose.addImage"><span class="icon icon-image"></span></button>
          <input id="dialog-image-input" class="hidden" type="file" accept="image/jpeg,image/png,image/webp,image/gif" multiple>
          <span id="dialog-counter" class="composer-counter"></span>
        <button id="dialog-button" class="primary" type="button"><span id="dialog-button-text" data-i18n="compose.post"></span></button>
      </div>
    </div>
  </div>
</dialog>

<dialog id="image-dialog" class="image-dialog">
  <div class="image-bar">
    <button id="image-close-button" class="square" type="button" data-i18n-title="close" data-i18n-label="close"><span class="icon icon-close"></span></button>
  </div>
  <img id="image-view" class="image-view" alt="">
</dialog>

<div id="popups" class="popups"></div>
</body>
</html>
