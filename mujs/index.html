    <kit-header id="header" menu menu-text data-i18n-menu-label="lessons.label"></kit-header>
    <kit-sidebar id="sidebar">
        <div class="sidebar-summary" slot="after">
          <span id="summary-text" class="summary-text"></span>
          <div id="stepper" class="stepper"></div>
        </div>
    </kit-sidebar>

    <div id="main" class="main">
      <div class="topbar">
        <kit-breadcrumbs>
          <span id="breadcrumb-unit"></span>
          <span id="breadcrumb-lesson"></span>
        </kit-breadcrumbs>
        <span id="lesson-counter" class="lesson-counter"></span>
        <button id="previous-button" class="square" type="button" data-i18n-title="lesson.previous" data-i18n-label="lesson.previous"><span class="icon icon-chevron-left"></span></button>
        <button id="following-button" class="square" type="button" data-i18n-title="lesson.following" data-i18n-label="lesson.following"><span class="icon icon-chevron-right"></span></button>
      </div>

      <div id="lesson-body" class="lesson-body">
        <div class="lesson-text">
          <div class="lesson-heading">
            <span id="lesson-number" class="lesson-number"></span>
            <span id="lesson-title" class="lesson-title"></span>
          </div>
          <span class="section-title" data-i18n="learn.title"></span>
          <div id="lesson-explain" class="lesson-explain selectable"></div>
          <span class="section-title" data-i18n="example.title"></span>
          <div class="code-block" dir="ltr"><pre id="lesson-example" class="code selectable"></pre></div>
        </div>

        <div class="lesson-work">
          <div class="task">
            <span class="section-title" data-i18n="task.title"></span>
            <span id="lesson-task" class="lesson-task selectable"></span>
          </div>
          <div class="editor" dir="ltr">
            <div id="editor-gutter" class="editor-gutter" aria-hidden="true"></div>
            <div class="editor-scroll">
              <div class="editor-stack">
                <pre id="editor-highlight" class="code editor-highlight" aria-hidden="true"></pre>
                <textarea id="code-editor" class="code editor-input" wrap="off" spellcheck="false" autocomplete="off" autocapitalize="off" data-i18n-label="editor.label"></textarea>
              </div>
            </div>
          </div>
          <span class="editor-hint" data-i18n="editor.hint"></span>
          <div class="work-actions">
            <button id="run-button" type="button"><span class="icon icon-play"></span><span data-i18n="run"></span></button>
            <button id="check-button" class="primary" type="button"><span class="icon icon-check"></span><span data-i18n="check"></span></button>
            <button id="reset-button" class="ghost" type="button"><span class="icon icon-refresh"></span><span data-i18n="reset"></span></button>
            <button id="solution-button" class="ghost" type="button"><span class="icon icon-file-text"></span><span data-i18n="solution"></span></button>
          </div>
          <div class="terminal">
            <div class="terminal-bar"><span class="section-title" data-i18n="console.title"></span></div>
            <div id="console" class="console selectable" dir="ltr"></div>
          </div>
          <div id="outcome" class="outcome hidden" role="status">
            <span id="outcome-text" class="outcome-text"></span>
            <div id="tests" class="tests"></div>
            <button id="next-button" class="primary hidden" type="button"><span data-i18n="next"></span><span class="icon icon-chevron-right"></span></button>
          </div>
        </div>
      </div>
    </div>
