<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" href="../favicon.png">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/theme.js"></script>
</head>
<body>
<div id="page">
  <div class="head">
    <span class="title"></span>
    <button id="close" class="square" type="button" hidden data-i18n-title="close" data-i18n-label="close"><span class="icon close"></span></button>
  </div>

  <form id="form" autocomplete="off">
    <span class="hint" data-i18n="hint"></span>
    <input id="token" type="password" autocomplete="off" spellcheck="false" data-i18n-placeholder="token" data-i18n-label="token">
    <span id="error" class="error" role="alert"></span>
    <div class="actions">
      <button id="create" type="button"><span class="icon external"></span><span data-i18n="create"></span></button>
      <button type="submit" class="primary"><span data-i18n="signIn"></span></button>
    </div>
  </form>

  <div id="profile">
    <div class="who">
      <div class="avatar"></div>
      <div class="names">
        <span class="name"></span>
        <span class="login"></span>
      </div>
    </div>
    <span class="bio"></span>
    <div id="details"></div>
    <span class="hint" data-i18n="signedIn"></span>
    <button id="out" class="danger" type="button"><span class="icon logout"></span><span data-i18n="signOut"></span></button>
  </div>
</div>
<script src="../assets/i18n.js"></script>
<script src="../assets/account.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
