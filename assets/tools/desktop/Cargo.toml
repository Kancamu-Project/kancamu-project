[package]
name = "desktop"
version = "0.1.0"
edition = "2024"
authors = ["Yuxie"]
description = "The website in its own window, which can install the native ArtCraft apps"
license = "AGPL-3.0-or-later"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", features = ["json"] }
zip = { version = "2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
