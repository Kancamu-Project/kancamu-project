    <noscript>
      <h1>Kancamu</h1>
      <p>Apps and tools, in one place.</p>
      <ul>
        <li><a href="muos/">muOS</a>: Web-Based Operating System.</li>
        <li><a href="drivemu/">Drivemu</a>: Simple file storage for everyone.</li>
        <li><a href="gallemu/">Gallemu</a>: Your images and videos, in one gallery.</li>
        <li><a href="spotimu/">Spotimu</a>: Your music, played from your own Drive.</li>
        <li><a href="lingomu/">Lingomu</a>: Learn a language with short lessons, a little every day.</li>
        <li><a href="mujs/">muJS</a>: Learn JavaScript by writing code and running it.</li>
        <li><a href="picmu/">Picmu</a>: Remove the background of an image or a video, or upscale it, right in your browser.</li>
        <li><a href="transmu/">Transmu</a>: Translate text with AI, right in your browser.</li>
        <li><a href="speechmu/">Speechmu</a>: Turn speech into text and text into speech with AI, right in your browser.</li>
        <li><a href="hashmu/">Hashmu</a>: Hash a text or a file, encrypt, make passwords, and encode, right in your browser.</li>
        <li><a href="searchmu/">Searchmu</a>: Advanced search of Google, with the results beside the fields.</li>
        <li><a href="youmu/">Youmu</a>: Your sign-in, your profile, and the settings of every app.</li>
        <li><a href="assetmu/">Assetmu</a>: Every colour, icon, font, and size of the apps, in one place.</li>
        <li><a href="kitmu/">Kitmu</a>: The UI kit of the apps: templates, helpers, and popups to copy.</li>
        <li><a href="muai/">muAI</a>: AI models running directly in your browser.</li>
      </ul>
      <p>This page needs JavaScript.</p>
