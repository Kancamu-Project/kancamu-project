<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kancamu</title>
    <meta name="description" content="Directory of apps and tools.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Kancamu">
    <meta property="og:title" content="Kancamu">
    <meta property="og:description" content="Directory of apps and tools.">
    <meta property="og:url" content="https://kancamu.site/">
    <meta property="og:image" content="https://kancamu.site/preview.png">
    <meta property="og:image:type" content="image/png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The directory of Kancamu: a grid of apps and tools.">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="icon" href="favicon.png" type="image/png">
    <link rel="stylesheet" href="assets/css/style.css">
    <link rel="stylesheet" href="assets/css/components.css">
    <link rel="stylesheet" href="layout.css">
    <script src="assets/js/theme.js"></script>
    <script defer src="assets/js/cleanup.js"></script>
<script defer src="assets/js/i18n.js"></script>
<script defer src="assets/js/popup.js"></script>
<script defer src="assets/js/components.js"></script>
<script defer src="assets/js/autocomplete.js"></script>
<script defer src="assets/js/account.js"></script>
<script defer src="assets/js/settings.js"></script>
<script defer src="app.js"></script>
</head>
<body>
    <div id="header" class="header">
        <div id="tabs-area">
            <div id="tabs"></div>
        </div>
        <div class="header-tools">
            <select id="language" class="language" data-i18n-title="language"></select>
            <button id="theme-button" data-i18n-title="theme">
                <div class="glyph theme"></div>
            </button>
            <button id="account-button" class="account" data-i18n-title="account">
                <div class="glyph user"></div>
            </button>
        </div>
    </div>
    <div id="main" class="main">
    <div id="viewer" hidden></div>
    <div id="home" class="home">
        <div id="toolbar">
            <label class="searchbox">
                <div class="glyph search"></div>
                <input id="project-search" type="search" data-i18n-placeholder="search">
            </label>
            <div class="spacer"></div>
            <button id="reset-button"><span data-i18n="reset"></span></button>
            <select id="alternative-filter" data-i18n-title="alternative"></select>
            <select id="publisher-filter" data-i18n-title="publisher"></select>
            <select id="sort-order">
                <option value="asc" data-i18n="sortAsc"></option>
                <option value="desc" data-i18n="sortDesc"></option>
            </select>
            <div id="view-toggle">
                <button data-view="grid" class="active" data-i18n-title="grid">
                    <div class="glyph grid"></div>
                </button>
                <button data-view="list" data-i18n-title="list">
                    <div class="glyph list"></div>
                </button>
            </div>
        </div>
        <div id="category-filter"></div>
        <div id="project-list"></div>
    </div>
    <div id="page" class="page" hidden></div>
    </div>
    <div id="footer" class="footer">
        <a href="/" target="_top" data-i18n="copyright"></a>
        <button id="about-button" type="button"><span data-i18n="about.title"></span></button>
        <button id="terms-button" type="button"><span data-i18n="terms.title"></span></button>
    </div>
    <div id="splash" class="splash" hidden>
        <div class="splash-card">
            <div class="splash-info">
                <div class="splash-brand">
                    <div class="splash-mark"></div>
                    <span class="splash-name"></span>
                </div>
                <span class="splash-tagline" data-i18n="splash.tagline"></span>
                <span class="splash-hint" data-i18n="splash.hint"></span>
                <span class="splash-copyright" data-i18n="copyright"></span>
            </div>
            <div class="splash-art" aria-hidden="true"></div>
        </div>
    </div>
    <div id="popups" class="popups"></div>
</body>
</html>
