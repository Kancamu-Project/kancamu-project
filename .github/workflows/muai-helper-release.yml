# Builds muai-helper for every system and puts the programs in assets/tools/muai-helper/bin on main, with their SHA-256 in assets/tools/muai-helper/latest.txt
# (install.ps1 and install.sh read latest.txt and download the programs from kancamu.site itself: there is no GitHub release). It runs when a tag "muai-helper-v<version>"
# is pushed (the version is the one of Cargo.toml), or by hand (the tab Actions, "Run workflow"):
#   git tag muai-helper-v0.2.0 && git push origin muai-helper-v0.2.0
name: muai-helper release

on:
  push:
    tags: ["muai-helper-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { key: windows-x64, os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe", test: true }
          - { key: linux-x64, os: ubuntu-latest, target: x86_64-unknown-linux-gnu, ext: "", test: true }
          - { key: linux-arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, ext: "", test: true }
          - { key: macos-arm64, os: macos-latest, target: aarch64-apple-darwin, ext: "", test: true }
          - { key: macos-x64, os: macos-latest, target: x86_64-apple-darwin, ext: "", test: false }   # made on the arm runner (the tests would need Rosetta)
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: The version of the tag is the one of Cargo.toml
        shell: bash
        run: |
          crate="$(grep -m1 '^version' assets/tools/muai-helper/Cargo.toml | cut -d'"' -f2)"
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME#muai-helper-v}" != "$crate" ]; then echo "The tag is ${GITHUB_REF_NAME#muai-helper-v} but Cargo.toml says $crate"; exit 1; fi
      - name: Rust target
        run: rustup target add ${{ matrix.target }}
      - name: Test
        if: ${{ matrix.test }}
        working-directory: assets/tools/muai-helper
        run: cargo test --target ${{ matrix.target }}
      - name: Build
        working-directory: assets/tools/muai-helper
        run: cargo build --release --target ${{ matrix.target }}
      - name: Name the program
        shell: bash
        run: |
          mkdir out
          cp "assets/tools/muai-helper/target/${{ matrix.target }}/release/muai-helper${{ matrix.ext }}" "out/muai-helper-${{ matrix.key }}${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: muai-helper-${{ matrix.key }}
          path: out/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: The programs and the checksums on main
        run: |
          version="$(grep -m1 '^version' assets/tools/muai-helper/Cargo.toml | cut -d'"' -f2)"
          base="https://kancamu.site/assets/tools/muai-helper/bin"
          mkdir -p assets/tools/muai-helper/bin
          cp out/muai-helper-* assets/tools/muai-helper/bin/
          {
            echo "version $version"
            for file in out/muai-helper-*; do
              name="$(basename "$file")"
              key="${name#muai-helper-}"; key="${key%.exe}"
              echo "$key $(sha256sum "$file" | cut -d' ' -f1) $base/$name"
            done
          } > assets/tools/muai-helper/latest.txt
          cat assets/tools/muai-helper/latest.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/tools/muai-helper/bin assets/tools/muai-helper/latest.txt
          git commit -m "muai-helper $version: the programs and their checksums"
          git push origin HEAD:main
