<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111115">
<link rel="icon" type="image/png" href="favicon.png">
<script src="../assets/theme.js"></script>
<title></title>
<meta name="description" content="muAI runs AI models directly in your browser with WebGPU. No server, no data sent.">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>
<div class="side" id="side">
  <div class="side-top">
    <div class="brand-row">
      <div class="logo"><div class="mark"></div><div class="name" data-i18n-html="logo"></div></div>
      <div class="brand-tools">
        <button id="settingsBtn" class="ghost square" type="button" data-i18n-title="settings" data-i18n-label="settings"><span class="icon i-sliders"></span></button>
        <button id="accountBtn" class="ghost square account" type="button" data-i18n-title="account" data-i18n-label="account"><span class="icon i-user"></span></button>
      </div>
    </div>
    <button id="newBtn" class="primary" type="button"><span class="icon i-plus"></span><span data-i18n="title.new"></span></button>
    <input id="search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.label">
  </div>
  <div id="list"></div>
  <div class="side-foot"><span data-i18n="copyright"></span></div>
  <div id="resizer" class="resizer" role="separator" aria-orientation="vertical" data-i18n-label="resizer.label" aria-valuemin="16" aria-valuemax="40" tabindex="0" data-i18n-title="resizer.title"></div>
</div>
<div class="overlay" id="overlay"></div>

<div class="app">
  <div class="topbar">
    <button id="menuBtn" class="ghost square" type="button" data-i18n-label="menu"><span class="icon i-menu"></span></button>
    <div id="title"></div>
    <button id="exportBtn" class="ghost hidden" type="button"><span class="icon i-download"></span><span data-i18n="export.md"></span></button>
    <button id="modelBadge" type="button" data-i18n-title="model.choose"><span class="icon i-cpu"></span><span id="modelLabel"></span><span class="icon i-chevron"></span></button>
  </div>

  <div id="main" class="scroll">
    <div class="wrap">
      <div class="chips" id="chips"></div>
      <div id="chat" class="hidden"></div>
    </div>
  </div>

  <div class="bottom">
    <div id="preview" class="hidden"><div id="previewImg" class="thumb" role="img" data-i18n-label="attached.image"></div><span id="previewName" class="note" data-i18n="attached.image"></span><button id="removeImg" class="ghost" type="button"><span class="icon i-x"></span><span data-i18n="remove"></span></button></div>
    <div id="loadStatus" class="hidden">
      <div id="progressBox" class="hidden">
        <div class="bar"><div id="barFill"></div></div>
        <span id="progressText" class="note"></span>
      </div>
      <span id="loadErr" class="note err hidden"></span>
    </div>
    <div class="composer">
      <input type="file" id="file" accept="image/*" hidden>
      <button id="attachBtn" class="square" type="button" data-i18n-title="attach.image" data-i18n-label="attach.image"><span class="icon i-image"></span></button>
      <textarea id="input" rows="1" data-i18n-placeholder="composer.type"></textarea>
      <button id="sendBtn" class="primary" type="button"><span class="icon i-send"></span><span data-i18n="send"></span></button>
      <button id="stopBtn" class="hidden" type="button"><span class="icon i-stop"></span><span data-i18n="stop"></span></button>
    </div>
    <span class="hint" data-i18n="hint"></span>
  </div>
</div>

<dialog id="modelDlg">
  <div class="dlg-body">
    <h2 data-i18n="model.choose"></h2>
    <span class="note sub" data-i18n="dlg.models.text"></span>
    <div id="familyFilter" class="filters"></div>
    <div id="modelList"></div>
    <div class="row"><button type="button" id="closeModelDlg"><span data-i18n="close"></span></button></div>
  </div>
</dialog>

<dialog id="settingsDlg">
  <form method="dialog" id="settingsForm">
    <h2 data-i18n="settings"></h2>
    <div class="fields">
      <div class="field">
        <span class="lbl" data-i18n="set.language"></span>
        <select class="language" data-i18n-label="set.language"></select>
      </div>
      <div class="field">
        <span class="lbl" data-i18n="set.theme"></span>
        <div class="seg">
          <button id="themeDark" type="button"><span class="icon i-moon"></span><span data-i18n="theme.dark"></span></button>
          <button id="themeLight" type="button"><span class="icon i-sun"></span><span data-i18n="theme.light"></span></button>
        </div>
      </div>
      <div class="field">
        <span class="lbl">WebGPU</span>
        <span id="gpuBadge" class="status"></span>
      </div>
    </div>
    <label>
      <span class="lbl" data-i18n="set.system.label"></span>
      <span class="h" data-i18n="set.system.hint"></span>
      <textarea id="setSystem"></textarea>
    </label>
    <div class="fields">
    <label>
      <span class="lbl" data-i18n="set.max.label"></span>
      <span class="h" data-i18n="set.max.hint"></span>
      <input id="setMax" type="number" min="64" max="4096" step="64">
    </label>
    <label>
      <span class="lbl"><span data-i18n="set.temp.label"></span>: <span id="tempVal"></span></span>
      <span class="h" data-i18n="set.temp.hint"></span>
      <input id="setTemp" type="range" min="0" max="1.5" step="0.1">
    </label>
    <label>
      <span class="lbl" data-i18n="set.ctx.label"></span>
      <span class="h" data-i18n="set.ctx.hint"></span>
      <input id="setCtx" type="number" min="2" max="60" step="2">
    </label>
    </div>
    <div class="data">
      <span class="lbl" data-i18n="set.data.label"></span>
      <span class="h" data-i18n="set.data.hint"></span>
      <div class="row-start">
        <button id="exportAllBtn" type="button"><span class="icon i-download"></span><span data-i18n="data.exportAll"></span></button>
        <button id="importBtn" type="button"><span class="icon i-upload"></span><span data-i18n="data.import"></span></button>
        <button id="clearAllBtn" class="danger" type="button"><span class="icon i-trash"></span><span data-i18n="data.deleteAll"></span></button>
        <input type="file" id="importFile" accept="application/json" hidden>
      </div>
    </div>
    <div class="row">
      <button type="button" id="resetSettings"><span class="icon i-refresh"></span><span data-i18n="reset"></span></button>
      <button type="button" id="cancelSettings"><span data-i18n="cancel"></span></button>
      <button type="submit" class="primary" value="save"><span data-i18n="save"></span></button>
    </div>
  </form>
</dialog>

<script src="../assets/i18n.js"></script>
<script src="../assets/account.js"></script>
<script src="../assets/storage.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
