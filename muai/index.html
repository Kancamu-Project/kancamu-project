<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#111115">
<link rel="icon" type="image/png" href="favicon.png">
<script src="../assets/theme.js"></script>
<title></title>
<meta name="description" content="muAI runs AI models directly in your browser with WebGPU. No server, no data sent.">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
</head>
<body>
<div class="side" id="side">
  <div class="brand-row">
    <div class="logo"><div class="logo-mark"></div><div class="logo-name" data-i18n-html="logo"></div></div>
    <div class="brand-tools">
      <button id="settings-button" class="ghost square" type="button" data-i18n-title="settings" data-i18n-label="settings"><span class="icon icon-sliders"></span></button>
      <button id="account-button" class="ghost square account" type="button" data-i18n-title="account" data-i18n-label="account"><span class="icon icon-user"></span></button>
    </div>
  </div>
  <div class="chat-controls">
    <button id="new-chat-button" class="primary" type="button"><span class="icon icon-plus"></span><span data-i18n="title.new"></span></button>
    <button id="model-picker" type="button" data-i18n-title="model.choose"><span class="icon icon-cpu"></span><span id="model-picker-label"></span><span class="icon icon-chevron"></span></button>
    <input id="chat-search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.label">
  </div>
  <div id="chat-list"></div>
  <div class="side-footer"><a href="/" target="_top" data-i18n="copyright"></a></div>
  <div id="side-resizer" class="side-resizer" role="separator" aria-orientation="vertical" data-i18n-label="resizer.label" aria-valuemin="16" aria-valuemax="40" tabindex="0" data-i18n-title="resizer.title"></div>
</div>
<div class="side-overlay" id="side-overlay"></div>

<div id="chat-app" class="app">
  <div class="topbar">
    <button id="menu-button" class="ghost square" type="button" data-i18n-label="menu"><span class="icon icon-menu"></span></button>
    <div id="chat-title"></div>
    <button id="export-button" class="ghost hidden" type="button"><span class="icon icon-download"></span><span data-i18n="export.md"></span></button>
  </div>

  <div id="chat-area" class="scrollable-area">
    <div class="chat-column">
      <span id="welcome-message" class="welcome-message" data-i18n="welcome"></span>
      <div id="chat" class="hidden"></div>
    </div>
  </div>

  <div class="composer-area">
    <div id="attachment-preview" class="hidden"><div id="attachment-preview-image" class="attachment-thumbnail" role="img" data-i18n-label="attached.image"></div><span id="attachment-preview-name" class="note" data-i18n="attached.image"></span><button id="remove-attachment-button" class="ghost" type="button"><span class="icon icon-x"></span><span data-i18n="remove"></span></button></div>
    <div id="load-status" class="hidden">
      <div id="progress-box" class="hidden">
        <div class="progress-bar"><div id="progress-fill"></div></div>
        <span id="progress-text" class="note"></span>
      </div>
      <span id="load-error" class="note error hidden"></span>
    </div>
    <div class="composer">
      <input type="file" id="image-file-input" accept="image/*" hidden>
      <button id="attach-button" class="square" type="button" data-i18n-title="attach.image" data-i18n-label="attach.image"><span class="icon icon-image"></span></button>
      <textarea id="message-input" rows="1" data-i18n-placeholder="composer.type"></textarea>
      <button id="send-button" class="primary square" type="button" data-i18n-title="send" data-i18n-label="send"><span class="icon icon-send"></span></button>
      <button id="stop-button" class="hidden" type="button"><span class="icon icon-stop"></span><span data-i18n="stop"></span></button>
    </div>
  </div>
</div>

<dialog id="model-dialog">
  <div class="dialog-body">
    <h2 data-i18n="model.choose"></h2>
    <span class="note dialog-subtitle" data-i18n="dlg.models.text"></span>
    <div class="model-controls">
      <select id="family-filter" data-i18n-label="model.filter.label"></select>
      <select id="model-sort" data-i18n-label="model.sort.label">
        <option value="size-asc" data-i18n="model.sort.sizeAsc"></option>
        <option value="size-desc" data-i18n="model.sort.sizeDesc"></option>
        <option value="name-asc" data-i18n="model.sort.nameAsc"></option>
        <option value="name-desc" data-i18n="model.sort.nameDesc"></option>
      </select>
    </div>
    <div id="model-list"></div>
    <div class="button-row"><button type="button" id="close-model-dialog-button"><span data-i18n="close"></span></button></div>
  </div>
</dialog>

<dialog id="settings-dialog">
  <form method="dialog" id="settings-form">
    <h2 data-i18n="settings"></h2>
    <div class="fields">
      <div class="field">
        <span class="field-label" data-i18n="set.language"></span>
        <select class="language" data-i18n-label="set.language"></select>
      </div>
      <div class="field">
        <span class="field-label" data-i18n="set.theme"></span>
        <div class="segmented-control">
          <button id="theme-dark-button" type="button"><span class="icon icon-moon"></span><span data-i18n="theme.dark"></span></button>
          <button id="theme-light-button" type="button"><span class="icon icon-sun"></span><span data-i18n="theme.light"></span></button>
        </div>
      </div>
      <div class="field">
        <span class="field-label">WebGPU</span>
        <span id="gpu-status" class="status"></span>
      </div>
    </div>
    <label>
      <span class="field-label" data-i18n="set.system.label"></span>
      <span class="field-hint" data-i18n="set.system.hint"></span>
      <textarea id="setting-system-prompt"></textarea>
    </label>
    <div class="fields">
    <label>
      <span class="field-label" data-i18n="set.max.label"></span>
      <span class="field-hint" data-i18n="set.max.hint"></span>
      <input id="setting-max-tokens" type="number" min="64" max="4096" step="64">
    </label>
    <label>
      <span class="field-label"><span data-i18n="set.temp.label"></span>: <span id="temperature-value"></span></span>
      <span class="field-hint" data-i18n="set.temp.hint"></span>
      <input id="setting-temperature" type="range" min="0" max="1.5" step="0.1">
    </label>
    <label>
      <span class="field-label" data-i18n="set.ctx.label"></span>
      <span class="field-hint" data-i18n="set.ctx.hint"></span>
      <input id="setting-context" type="number" min="2" max="60" step="2">
    </label>
    </div>
    <div class="data-section">
      <span class="field-label" data-i18n="set.data.label"></span>
      <span class="field-hint" data-i18n="set.data.hint"></span>
      <div class="button-row-start">
        <button id="export-all-button" type="button"><span class="icon icon-download"></span><span data-i18n="data.exportAll"></span></button>
        <button id="import-button" type="button"><span class="icon icon-upload"></span><span data-i18n="data.import"></span></button>
        <button id="clear-all-button" class="danger" type="button"><span class="icon icon-trash"></span><span data-i18n="data.deleteAll"></span></button>
        <input type="file" id="import-file-input" accept="application/json" hidden>
      </div>
    </div>
    <div class="button-row">
      <button type="button" id="reset-settings-button"><span class="icon icon-refresh"></span><span data-i18n="reset"></span></button>
      <button type="button" id="cancel-settings-button"><span data-i18n="cancel"></span></button>
      <button type="submit" class="primary" value="save"><span data-i18n="save"></span></button>
    </div>
  </form>
</dialog>

<script src="../assets/i18n.js"></script>
<script src="../assets/account.js"></script>
<script src="../assets/storage.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
