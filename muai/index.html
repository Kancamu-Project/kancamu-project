<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#1a1a1b">
<link rel="icon" type="image/png" href="favicon.png">
<script src="../assets/js/theme.js"></script>
<title></title>
<meta name="description" content="muAI runs AI models directly in your browser with WebGPU. No server, no data sent.">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/page.css">
<link rel="stylesheet" href="layout.css">
<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/popup.js"></script>
<script defer src="../assets/js/components.js"></script>
<script defer src="../assets/js/autocomplete.js"></script>
<script defer src="../assets/js/account.js"></script>
<script defer src="../assets/js/settings.js"></script>
<script defer src="../assets/js/storage.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>
<kit-header id="header" menu></kit-header>
<div class="sidebar" id="sidebar">
  <div class="chat-controls">
    <button id="new-chat-button" class="primary" type="button"><span class="icon icon-plus"></span><span data-i18n="title.new"></span></button>
    <select id="model-picker" data-i18n-label="model.choose"></select>
    <input id="chat-search" type="search" data-i18n-placeholder="search.placeholder" data-i18n-label="search.label">
  </div>
  <div id="chat-list"></div>
  <div id="sidebar-resizer" class="sidebar-resizer" role="separator" aria-orientation="vertical" data-i18n-label="resizer.label" aria-valuemin="16" aria-valuemax="40" tabindex="0" data-i18n-title="resizer.title"></div>
</div>
<div class="sidebar-overlay" id="sidebar-overlay"></div>

<div id="main" class="main">
  <div class="topbar">
    <div id="chat-title"></div>
    <button id="export-button" class="ghost hidden" type="button"><span class="icon icon-download"></span><span data-i18n="export.md"></span></button>
  </div>

  <div id="chat-area" class="scrollable-area">
    <div class="chat-column">
      <span id="welcome-message" class="welcome-message" data-i18n="welcome"></span>
      <div id="chat" class="hidden"></div>
    </div>
  </div>

  <div class="composer-area">
    <div id="attachment-preview" class="hidden"><div id="attachment-preview-image" class="attachment-thumbnail" role="img" data-i18n-label="attached.image"></div><span id="attachment-preview-name" class="note" data-i18n="attached.image"></span><button id="remove-attachment-button" class="ghost" type="button"><span class="icon icon-close"></span><span data-i18n="remove"></span></button></div>
    <div id="load-status" class="hidden">
      <div id="progress-box" class="hidden">
        <div class="progress"><div id="progress-fill" class="progress-fill"></div></div>
        <span id="progress-text" class="note"></span>
      </div>
      <span id="load-error" class="note error hidden"></span>
    </div>
    <div class="composer">
      <input type="file" id="image-file-input" accept="image/*" hidden>
      <button id="attach-button" class="square" type="button" data-i18n-title="attach.image" data-i18n-label="attach.image"><span class="icon icon-image"></span></button>
      <textarea id="message-input" rows="1" data-i18n-placeholder="composer.type"></textarea>
      <button id="send-button" class="primary square" type="button" data-i18n-title="send" data-i18n-label="send"><span class="icon icon-send"></span></button>
      <button id="stop-button" class="hidden" type="button"><span class="icon icon-stop"></span><span data-i18n="stop"></span></button>
    </div>
  </div>
</div>
<kit-footer id="footer"></kit-footer>

<div id="popups" class="popups"></div>
</body>
</html>
