<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#1a1a1b">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/page.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/js/theme.js"></script>
<script defer src="../assets/js/cleanup.js"></script>
<script defer src="../assets/js/url.js"></script>
<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/popup.js"></script>
<script defer src="../assets/js/components.js"></script>
<script defer src="../assets/js/account.js"></script>
<script defer src="../assets/js/settings.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>

<kit-header id="header"></kit-header>
<div id="main" class="main">

  <div id="views"></div>

  <!-- Speech to text -->
  <section id="listen-panel" class="panel">
    <div class="field-bar">
      <label class="field">
        <span class="field-label" data-i18n="model.label"></span>
        <select id="model-select" data-i18n-label="model.label"></select>
      </label>
      <label class="field">
        <span class="field-label" data-i18n="listen.language"></span>
        <select id="listen-language" data-i18n-label="listen.language"></select>
      </label>
    </div>

    <div class="listen-actions">
      <button id="choose-button" class="primary" type="button"><span class="icon icon-upload"></span><span data-i18n="listen.choose"></span></button>
      <button id="record-button" type="button"><span class="icon icon-audio"></span><span id="record-label" data-i18n="listen.record"></span></button>
      <span id="listen-source" class="field-hint"></span>
      <input id="file-input" type="file" accept="audio/*,video/*" hidden>
    </div>

    <div class="pane">
      <div class="pane-bar">
        <span class="pane-title" data-i18n="listen.result"></span>
        <span id="listen-count" class="pane-count"></span>
        <button id="copy-listen" class="ghost square" type="button" disabled data-i18n-title="copy" data-i18n-label="copy"><span class="icon icon-copy"></span></button>
        <button id="save-text" class="ghost square" type="button" disabled data-i18n-title="listen.saveText" data-i18n-label="listen.saveText"><span class="icon icon-file-text"></span></button>
        <button id="save-subtitles" class="ghost square" type="button" disabled data-i18n-title="listen.saveSubtitles" data-i18n-label="listen.saveSubtitles"><span class="icon icon-download"></span></button>
      </div>
      <div id="listen-text" class="pane-text selectable" role="textbox" aria-readonly="true" tabindex="0" dir="auto" data-i18n-label="listen.result"></div>
    </div>
  </section>

  <!-- Text to speech -->
  <section id="speak-panel" class="panel hidden">
    <div class="field-bar">
      <label class="field">
        <span class="field-label" data-i18n="speak.language"></span>
        <select id="speak-language" data-i18n-label="speak.language"></select>
      </label>
      <label class="field">
        <span class="field-label" data-i18n="speak.voice"></span>
        <select id="voice-select" data-i18n-label="speak.voice"></select>
      </label>
    </div>

    <div class="pane">
      <div class="pane-bar">
        <span class="pane-title" data-i18n="speak.text"></span>
        <span id="speak-count" class="pane-count"></span>
        <button id="clear-button" class="ghost square" type="button" data-i18n-title="clear" data-i18n-label="clear"><span class="icon icon-close"></span></button>
      </div>
      <textarea id="speak-text" class="pane-text" dir="auto" data-i18n-placeholder="speak.placeholder" data-i18n-label="speak.text"></textarea>
    </div>

    <div class="speak-actions">
      <button id="speak-button" class="primary" type="button"><span class="icon icon-play"></span><span data-i18n="speak.play"></span></button>
      <button id="stop-button" class="hidden" type="button"><span class="icon icon-stop"></span><span data-i18n="stop"></span></button>
      <button id="save-audio" type="button" disabled><span class="icon icon-download"></span><span data-i18n="speak.save"></span></button>
    </div>
  </section>

</div>
<kit-footer id="footer" status></kit-footer>

<div id="popups" class="popups"></div>
</body>
</html>
