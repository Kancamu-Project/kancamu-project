<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notepad</title>
    <link rel="icon" href="favicon.png">
    <script>
      // Where the OS is: its window passes the address as ?os=; a page opened on its own looks next to /apps.
      (() => {
        const os = new URLSearchParams(location.search).get('os') || new URL('../../', location.href).href;
        const add = (el) => document.head.append(el);
        add(Object.assign(document.createElement('script'), { type: 'importmap', textContent: JSON.stringify({ imports: { 'webos/': os + 'system/' } }) }));
        add(Object.assign(document.createElement('link'), { rel: 'stylesheet', href: os + 'style/app.css' }));
      })();
    </script>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="app.js"></script>
</head>
<body>
    <div class="notepad">
        <div id="tabs" class="tabs" role="tablist"></div>
        <div class="menurow">
            <div id="menubar" class="menubar" role="menubar"></div>
            <button id="settings-btn" class="tbtn" type="button"><i class="icon" data-icon="settings"></i></button>
        </div>
        <div id="editors" class="editors"></div>
        <div id="status" class="status"></div>
    </div>
</body>
</html>
