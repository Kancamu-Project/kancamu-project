<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#1a1a1b">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/page.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/js/theme.js"></script>
<script defer src="../assets/js/cleanup.js"></script>
<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/popup.js"></script>
<script defer src="../assets/js/components.js"></script>
<script defer src="../assets/js/account.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>

  <kit-header id="header" theme></kit-header>

  <div id="main" class="main">
    <div id="views" class="views"></div>
    <div id="toolbar" class="toolbar">
      <div class="toolbar-row">
        <kit-search input-id="kit-search" data-i18n-placeholder="search" data-i18n-label="search"></kit-search>
        <div class="spacer"></div>
        <button id="reset-button" class="danger" type="button" hidden><span data-i18n="reset"></span></button>
      </div>
      <div id="tag-filter" class="tag-filter"></div>
    </div>
    <div id="content" class="content">
      <span id="no-results" class="no-results" data-i18n="noResults" hidden></span>
    </div>
  </div>
  <kit-footer id="footer"></kit-footer>

<div id="popups" class="popups"></div>
</body>
</html>
