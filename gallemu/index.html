<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#1a1a1b">
<link rel="stylesheet" href="../assets/css/style.css">
<link rel="stylesheet" href="../assets/css/components.css">
<link rel="stylesheet" href="../assets/css/page.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/js/theme.js"></script>
<script defer src="../assets/js/cleanup.js"></script>
<script defer src="../assets/js/url.js"></script>
<script defer src="../assets/js/i18n.js"></script>
<script defer src="../assets/js/popup.js"></script>
<script defer src="../assets/js/components.js"></script>
<script defer src="../assets/js/autocomplete.js"></script>
<script defer src="../assets/js/account.js"></script>
<script defer src="../assets/js/transfer.js"></script>
<script defer src="../assets/js/storage.js"></script>
<script type="module" src="app.js"></script>
</head>
<body>

<kit-header id="header"></kit-header>
<div id="main" class="main">

  <div class="toolbar">
    <kit-search input-id="gallery-search" data-i18n-placeholder="search" data-i18n-label="search.label"></kit-search>
    <select id="album-select" data-i18n-label="album.label"></select>
    <select id="sort-order" data-i18n-label="sort.label">
      <option value="name-asc" data-i18n="sort.nameAsc"></option>
      <option value="name-desc" data-i18n="sort.nameDesc"></option>
      <option value="size-asc" data-i18n="sort.sizeAsc"></option>
      <option value="size-desc" data-i18n="sort.sizeDesc"></option>
    </select>
    <button id="refresh-button" class="square" type="button" data-i18n-title="refresh" data-i18n-label="refresh"><span class="icon icon-refresh"></span></button>
  </div>

  <div id="gallery" class="gallery">
    <div id="gallery-grid" class="gallery-grid hidden"></div>
    <kit-empty id="empty-state" class="hidden" icon="image">
      <button id="empty-action-button" slot="action" class="primary hidden" type="button"><span class="icon icon-user"></span><span data-i18n="login.signIn"></span></button>
    </kit-empty>
  </div>

</div>
<kit-footer id="footer" status></kit-footer>

<dialog id="viewer-dialog" class="viewer-dialog">
  <div class="viewer-bar">
    <span id="viewer-name" class="viewer-name"></span>
    <span id="viewer-counter" class="viewer-counter"></span>
    <button id="viewer-download-button" class="square" type="button" data-i18n-title="viewer.download" data-i18n-label="viewer.download"><span class="icon icon-download"></span></button>
    <button id="viewer-close-button" class="square" type="button" data-i18n-title="close" data-i18n-label="close"><span class="icon icon-close"></span></button>
  </div>
  <div class="viewer-stage">
    <div id="viewer-image" class="viewer-image" role="img"></div>
    <video id="viewer-video" class="viewer-video hidden" controls></video>
    <span id="viewer-message" class="viewer-message hidden"></span>
    <button id="viewer-previous-button" class="square viewer-previous" type="button" data-i18n-title="viewer.previous" data-i18n-label="viewer.previous"><span class="icon icon-chevron-left"></span></button>
    <button id="viewer-next-button" class="square viewer-next" type="button" data-i18n-title="viewer.next" data-i18n-label="viewer.next"><span class="icon icon-chevron-right"></span></button>
  </div>
</dialog>

<div id="popups" class="popups"></div>
</body>
</html>
