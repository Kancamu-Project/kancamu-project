<body>
<!-- seo-body -->
<noscript>
  <h1>Lingomu</h1>
  <p>Learn a language with short lessons, a little every day.</p>
  <p><a href="../">Kancamu</a></p>
  <p>This page needs JavaScript.</p>

    <kit-header id="header" menu menu-text data-i18n-menu-label="lessons.label"></kit-header>
    <kit-sidebar id="sidebar">
        <select id="course-select" slot="before" data-i18n-label="course.label"></select>
        <div class="sidebar-summary" slot="after">
          <div class="stats">
            <div class="stat">
              <span class="icon icon-zap"></span>
              <span id="streak-count" class="stat-value"></span>
              <span class="stat-label" data-i18n="stats.streak"></span>
            </div>
            <div class="stat">
              <span class="icon icon-star"></span>
              <span id="total-xp" class="stat-value"></span>
              <span class="stat-label" data-i18n="stats.xp"></span>
            </div>
          </div>
          <span id="goal-text" class="goal-text"></span>
          <div class="progress"><div id="goal-fill" class="progress-fill"></div></div>
        </div>
    </kit-sidebar>

    <div id="main" class="main">
      <div id="overview-view" class="overview-view">
        <div class="overview-heading">
          <span id="overview-number" class="overview-number"></span>
          <div class="overview-titles">
            <span id="overview-title" class="overview-title"></span>
            <span id="overview-unit" class="overview-unit"></span>
          </div>
        </div>
        <span class="section-title" data-i18n="overview.words"></span>
        <div id="overview-words" class="overview-words selectable"></div>
        <span id="overview-state" class="overview-state"></span>
        <button id="start-button" class="primary" type="button"><span></span></button>
      </div>

  <div id="lesson-view" class="lesson-view hidden">
    <div class="lesson-bar">
      <button id="quit-button" class="ghost square" type="button" data-i18n-title="quit.label" data-i18n-label="quit.label"><span class="icon icon-close"></span></button>
      <div class="progress"><div id="lesson-fill" class="progress-fill"></div></div>
      <div id="hearts" class="hearts"><span class="icon icon-heart"></span><span id="hearts-count" class="hearts-count"></span></div>
    </div>
    <div id="exercise" class="exercise"></div>
    <div id="feedback" class="feedback hidden" role="status">
      <span id="feedback-title" class="feedback-title"></span>
      <span id="feedback-answer" class="feedback-answer selectable"></span>
    </div>
    <div class="lesson-actions">
      <button id="check-button" class="primary" type="button" disabled><span data-i18n="check"></span></button>
    </div>
  </div>

  <div id="result-view" class="result-view hidden">
    <div class="result-card">
      <span id="result-title" class="result-title"></span>
      <div id="result-lines" class="result-lines"></div>
      <div class="result-actions">
        <button id="result-retry-button" class="hidden" type="button"><span data-i18n="failed.retry"></span></button>
        <button id="result-continue-button" class="primary" type="button"><span data-i18n="continue"></span></button>
      </div>
    </div>
  </div>

    </div>
    <kit-footer id="footer" status></kit-footer>

<div id="popups" class="popups"></div>
</body>
