<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
<meta name="theme-color" content="#111115">
<link rel="stylesheet" href="../assets/style.css">
<link rel="stylesheet" href="layout.css">
<script src="../assets/theme.js"></script>
</head>
<body>

  <div id="header" class="header">
    <div class="logo"><div class="logo-mark"></div><span class="logo-name" data-i18n-html="logo"></span></div>
    <div class="header-tools">
      <button id="theme-button" class="square" type="button" data-i18n-title="theme" data-i18n-label="theme"><span class="icon icon-sun"></span></button>
      <button id="menu-button" class="square menu-button" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-title="menu" data-i18n-label="menu"><span class="icon icon-list"></span></button>
      <button id="account-button" class="square account" type="button" data-i18n-title="account" data-i18n-label="account"><span class="icon icon-user"></span></button>
    </div>
  </div>
  <div id="sidebar" class="sidebar">
      <div id="sidebar-nav" class="sidebar-nav"></div>
  </div>

  <div id="main" class="main">
    <div id="content" class="content"></div>
  </div>
  <div id="footer" class="footer">
    <a class="copyright" href="/" target="_top" data-i18n="copyright"></a>
  </div>

<script src="../assets/i18n.js"></script>
<script src="../assets/dialog.js"></script>
<script src="../assets/autocomplete.js"></script>
<script src="../assets/account.js"></script>
<script type="module" src="script.js"></script>
</body>
</html>
